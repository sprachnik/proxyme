<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>proxme</title>
  <meta name="theme-color" content="#14161c" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>
  <div id="hud">
    <strong>proxme</strong>
    <button id="locate" type="button" title="Use my location">📍</button>
    <select id="radius" title="Search radius">
      <option value="5">5 km</option>
      <option value="10">10 km</option>
      <option value="20" selected>20 km</option>
      <option value="50">50 km</option>
    </select>
    <button id="aiskey" type="button" title="Set your free aisstream.io key to see boats">🔑</button>
    <button id="wx" type="button" title="Toggle weather: rain radar + wind/temperature">🌦</button>
    <span id="status">locating…</span>
    <span class="legend">
      <i style="background:#4ea8ff"></i>air
      <i style="background:#ffb347"></i>light
      <i style="background:#ff5470"></i>heli
      <i style="background:#9d7bff"></i>glider
      <i style="background:#2fd6c2"></i>sea
    </span>
  </div>
  <div id="panel"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
  <script src="overlays.js"></script>
  <script>
    // Not on localhost — a caching worker fights `npm run dev`.
    if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
