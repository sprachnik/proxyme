[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Friendly paths: /api/aircraft, /api/vessels
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Netlify serves .webmanifest as octet-stream, which Chrome may reject.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Never let a stale worker pin an old shell.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
